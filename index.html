<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reserva la pista de pádel</title>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      // Tu PUBLIC KEY de EmailJS
      emailjs.init("1gXtw-8vXGl4rBmgG");
   })();
</script>

<style>
body { font-family: sans-serif; background:#f2f2f2; margin:0; }
header { background:#2ecc71; color:white; padding:15px; text-align:center; }
.container { max-width:800px; margin:auto; padding:20px; }
form { background:white; padding:15px; border-radius:6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
label { display:block; margin-top:10px; font-weight: bold; }
input, select, button { width:100%; padding:10px; margin-top:5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
button { background:#27ae60; color:white; border:none; margin-top:15px; cursor:pointer; font-weight: bold; }
button:hover { background: #219150; }
button:disabled { background: #95a5a6; }
.logos { display: flex; justify-content: center; align-items: center; gap: 20px; }
.logo { max-height: 70px; }
</style>
</head>

<body>

<header>
  <div class="logos">
    <img src="logo1.png" class="logo" alt="">
    <img src="logo2.jpeg" class="logo" alt="">
  </div>
  <h1>Reservas Pista de Pádel</h1>
</header>

<div class="container">
<form id="reservaForm">
  <label>Nombre Completo:</label>
  <input type="text" id="nombre" required>

  <label>Email:</label>
  <input type="email" id="email" required>

  <label>Fecha:</label>
  <input type="date" id="fecha" required>

  <label>Horario:</label>
  <select id="hora" required>
    <option value="">Selecciona una fecha primero</option>
  </select>

  <button type="submit" id="btnReservar">Confirmar Reserva</button>
</form>
</div>

<script type="module">
// IMPORTACIÓN DE FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

// CONFIGURACIÓN FIREBASE
const firebaseConfig = {
  apiKey: "905462199088",
  authDomain: "reserva-pista-de-padel.firebaseapp.com",
  projectId: "reserva-pista-de-padel",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// HORARIOS DISPONIBLES
const horariosSemana = {
  1: ["8:00 - 9:30", "9:30 - 11:00", "17:00 - 18:30", "18:30 - 20:00"], // Lun
  2: ["17:00 - 18:30", "18:30 - 20:00"],                               // Mar
  3: ["8:00 - 9:30", "9:30 - 11:00", "17:00 - 18:30", "18:30 - 20:00"], // Mie
  4: ["17:00 - 18:30", "18:30 - 20:00"],                               // Jue
  5: ["8:00 - 9:30", "9:30 - 11:00", "17:00 - 18:30", "18:30 - 20:00"]  // Vie
};

const nombreInput = document.getElementById("nombre");
const emailInput = document.getElementById("email");
const fechaInput = document.getElementById("fecha");
const horaSelect = document.getElementById("hora");
const form = document.getElementById("reservaForm");

fechaInput.addEventListener("change", cargarHoras);
form.addEventListener("submit", guardarReserva);

function formatearFecha(fechaStr){
  const [y, m, d] = fechaStr.split("-");
  const f = new Date(y, m - 1, d);
  return f.toLocaleDateString("es-ES", { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}

// FUNCIÓN PARA CARGAR HORARIOS DESDE FIREBASE (Sigue siendo necesaria para bloquear horas ocupadas)
async function cargarHoras(){
  if(!fechaInput.value) return;
  horaSelect.innerHTML = '<option value="">Comprobando disponibilidad...</option>';
  
  const [year, month, day] = fechaInput.value.split("-");
  const fechaSeleccionada = new Date(year, month - 1, day);
  const diaSemana = fechaSeleccionada.getDay(); 

  if(!horariosSemana[diaSemana]){
    horaSelect.innerHTML = '<option value="">Cerrado (Solo Lunes a Viernes)</option>';
    return;
  }

  try {
    const snap = await getDocs(collection(db, "reservas"));
    const ocupados = snap.docs.map(doc => doc.data());

    horaSelect.innerHTML = '<option value="">Selecciona una hora</option>';
    horariosSemana[diaSemana].forEach(h => {
      const estaOcupado = ocupados.some(r => r.fecha === fechaInput.value && r.hora === h);
      const opt = document.createElement("option");
      opt.value = h;
      opt.textContent = estaOcupado ? h + " (RESERVADO)" : h;
      if(estaOcupado) opt.disabled = true;
      horaSelect.appendChild(opt);
    });
  } catch (error) {
    console.error("Error:", error);
    horaSelect.innerHTML = '<option value="">Error de conexión</option>';
  }
}

// FUNCIÓN PARA GUARDAR Y ENVIAR EMAIL
async function guardarReserva(e){
  e.preventDefault();
  const btn = document.getElementById("btnReservar");
  btn.disabled = true;
  btn.textContent = "Procesando...";

  try {
    // 1. Guardar en Firestore
    await addDoc(collection(db, "reservas"), {
      nombre: nombreInput.value,
      email: emailInput.value,
      fecha: fechaInput.value,
      hora: horaSelect.value,
      timestamp: new Date()
    });

    // 2. Enviar con EmailJS
    const SERVICE_ID = "service_ai3otnx";
    const TEMPLATE_ID = "template_zbmh83z";

    await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
      nombre: nombreInput.value,
      email: emailInput.value,
      fecha: formatearFecha(fechaInput.value),
      hora: horaSelect.value
    });

    alert("✅ ¡Reserva realizada! Se ha enviado la notificación.");
    form.reset();
    horaSelect.innerHTML = '<option value="">Selecciona una fecha primero</option>';

  } catch (err) {
    console.error("Error crítico:", err);
    alert("Hubo un error. Revisa la consola (F12) para más detalles.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Confirmar Reserva";
  }
}
</script>
</body>
</html>
