<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reserva la pista de pádel</title>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="text/javascript">
   (function(){
      // Reemplaza con tu PUBLIC KEY de EmailJS
      emailjs.init("1gXtw-8vXGl4rBmgG");
   })();
</script>

<style>
body { font-family: sans-serif; background:#f2f2f2; margin:0; }
header { background:#2ecc71; color:white; padding:15px; text-align:center; }
.container { max-width:800px; margin:auto; padding:20px; }
form { background:white; padding:15px; border-radius:6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
label { display:block; margin-top:10px; font-weight: bold; }
input, select, button { width:100%; padding:8px; margin-top:5px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
button { background:#27ae60; color:white; border:none; margin-top:15px; cursor:pointer; font-size: 16px; font-weight: bold; }
button:hover { background: #219150; }
table { width:100%; border-collapse:collapse; margin-top:20px; background: white; }
th,td { border:1px solid #ccc; padding:8px; text-align:center; }
th { background:#27ae60; color:white; }
.logos { display: flex; justify-content: center; align-items: center; gap: 20px; }
.logo { max-height: 70px; }
</style>
</head>

<body>

<header>
  <div class="logos">
    <img src="logo1.png" class="logo" alt="">
    <img src="logo2.jpeg" class="logo" alt="">
  </div>
  <h1>Reservas Pista de Pádel</h1>
</header>

<div class="container">
<form id="reservaForm">
  <label>Nombre:</label>
  <input type="text" id="nombre" required>

  <label>Email:</label>
  <input type="email" id="email" required>

  <label>Fecha:</label>
  <input type="date" id="fecha" required>

  <label>Horario:</label>
  <select id="hora" required>
    <option value="">Selecciona una fecha primero</option>
  </select>

  <button type="submit" id="btnReservar">Confirmar Reserva</button>
</form>

<h2>Reservas realizadas</h2>
<table>
  <thead>
    <tr><th>Nombre</th><th>Fecha</th><th>Hora</th></tr>
  </thead>
  <tbody id="tablaReservas"></tbody>
</table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "905462199088",
  authDomain: "1:905462199088:web:ee3458a2d1081b459a8ef5",
  projectId: "reserva-pista-de-padel",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const horariosSemana = {
  1: ["8:00 - 9:30", "9:30 - 11:00", "17:00 - 18:30", "18:30 - 20:00"],
  2: ["17:00 - 18:30", "18:30 - 20:00"],
  3: ["8:00 - 9:30", "9:30 - 11:00", "17:00 - 18:30", "18:30 - 20:00"],
  4: ["17:00 - 18:30", "18:30 - 20:00"],
  5: ["8:00 - 9:30", "9:30 - 11:00", "17:00 - 18:30", "18:30 - 20:00"]
};

const nombreInput = document.getElementById("nombre");
const emailInput = document.getElementById("email");
const fechaInput = document.getElementById("fecha");
const horaSelect = document.getElementById("hora");
const tabla = document.getElementById("tablaReservas");
const form = document.getElementById("reservaForm");

fechaInput.addEventListener("change", cargarHoras);
form.addEventListener("submit", guardarReserva);

function formatearFecha(fechaStr){
  const [y, m, d] = fechaStr.split("-");
  const f = new Date(y, m - 1, d);
  return f.toLocaleDateString("es-ES", { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}

async function cargarHoras(){
  if(!fechaInput.value) return;
  
  horaSelect.innerHTML = '<option value="">Cargando...</option>';
  
  // Obtener el día de la semana (Lunes=1, Martes=2...)
  const [year, month, day] = fechaInput.value.split("-");
  const fechaSeleccionada = new Date(year, month - 1, day);
  const diaSemana = fechaSeleccionada.getDay(); 

  if(!horariosSemana[diaSemana]){
    horaSelect.innerHTML = '<option value="">Cerrado este día</option>';
    return;
  }

  try {
    const snap = await getDocs(collection(db, "reservas"));
    const reservasOcupadas = snap.docs.map(doc => doc.data());

    horaSelect.innerHTML = '<option value="">Selecciona hora</option>';
    
    horariosSemana[diaSemana].forEach(h => {
      const ocupado = reservasOcupadas.some(r => r.fecha === fechaInput.value && r.hora === h);
      const opt = document.createElement("option");
      opt.value = h;
      opt.textContent = ocupado ? h + " (Ocupado)" : h;
      if(ocupado) opt.disabled = true;
      horaSelect.appendChild(opt);
    });
  } catch (error) {
    console.error("Error en Firebase:", error);
    horaSelect.innerHTML = '<option value="">Error al cargar</option>';
  }
}

async function guardarReserva(e){
  e.preventDefault();
  const btn = document.getElementById("btnReservar");
  btn.disabled = true;
  btn.textContent = "Procesando...";

  try {
    // 1. Verificar Firebase nuevamente
    const snap = await getDocs(collection(db, "reservas"));
    const existe = snap.docs.some(doc => {
      const r = doc.data();
      return r.fecha === fechaInput.value && r.hora === horaSelect.value;
    });

    if(existe){
      alert("❌ Horario ya reservado.");
      cargarHoras();
      return;
    }

    // 2. Guardar
    await addDoc(collection(db, "reservas"), {
      nombre: nombreInput.value,
      email: emailInput.value,
      fecha: fechaInput.value,
      hora: horaSelect.value
    });

    // 3. Notificación EmailJS
    // REEMPLAZA ESTOS 2 IDS
    const SERVICE_ID = "service_ai3otnx";
    const TEMPLATE_ID = "service_ai3otnx";

    await emailjs.send(service_ai3otnx, service_ai3otnx, {
      nombre: nombreInput.value,
      email: emailInput.value,
      fecha: formatearFecha(fechaInput.value),
      hora: horaSelect.value
    });

    alert("✅ Reserva exitosa.");
    form.reset();
    horaSelect.innerHTML = '<option value="">Selecciona una fecha primero</option>';
    cargarTabla();

  } catch (err) {
    console.error(err);
    alert("Error al reservar.");
  } finally {
    btn.disabled = false;
    btn.textContent = "Confirmar Reserva";
  }
}

async function cargarTabla(){
  try {
    const snap = await getDocs(query(collection(db, "reservas"), orderBy("fecha", "asc")));
    tabla.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      tabla.innerHTML += `<tr><td>${d.nombre}</td><td>${formatearFecha(d.fecha)}</td><td>${d.hora}</td></tr>`;
    });
  } catch (e) { console.log(e); }
}

cargarTabla();
</script>
</body>
</html>
